name: Daily E-Ink Update
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  update_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: pip install Pillow groq requests
      
      - name: Generate Daily Content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -u generate_daily.py
          if [ $? -eq 0 ]; then
            echo "✓ generate_daily.py completed successfully"
          else
            echo "✗ generate_daily.py failed with exit code $?"
            exit 1
          fi
      
      - name: Fetch Asher Comic
        run: |
          python fetch_asher.py
          if [ $? -eq 0 ]; then
            echo "✓ fetch_asher.py completed successfully"
          else
            echo "✗ fetch_asher.py failed with exit code $?"
            exit 1
          fi
      
      - name: Persist last good comic
        run: |
          if [ -f last_comic.png ] && ! git diff --quiet -- last_comic.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_comic.png
            git commit -m "Update cached comic [skip ci]"
            git push
          else
            echo "No change to last_comic.png; nothing to commit."
          fi

      - name: Verify All Files Created
        run: |
          echo "=== Checking generated files ==="
          for file in history.png animal.png affirmation.png joke.png asher_comic.png; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "✓ $file ($size)"
            else
              echo "✗ $file MISSING"
            fi
          done
          
          if ! [ -f asher_comic.png ]; then
            echo ""
            echo "ERROR: asher_comic.png was not created!"
            exit 1
          fi
      
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      
      - name: Upload to Dropbox
        env:
          RCLONE_CONFIG_DROPBOX_TYPE: dropbox
          RCLONE_CONFIG_DROPBOX_TOKEN: ${{ secrets.RCLONE_DROPBOX_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Checking Dropbox connection ==="
          rclone about dropbox: || echo "WARNING: rclone about failed"

          echo "=== Listing destination BEFORE upload ==="
          rclone lsl dropbox:"Apps/pradohood github/" || echo "WARNING: could not list destination"

          echo "=== Uploading files ==="
          for f in history.png animal.png affirmation.png joke.png asher_comic.png; do
            echo "--- $f ---"
            rclone copy -v --stats-one-line "./$f" dropbox:"Apps/pradohood github/"
          done

          echo "=== Listing destination AFTER upload ==="
          rclone lsl dropbox:"Apps/pradohood github/"
